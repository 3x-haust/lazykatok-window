name: Windows port

on:
  push:
    branches: [windows-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 / Rust 1.91
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      KATOK_EMBEDDER: local-test
      OPENSSL_RUST_USE_NASM: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Synthetic tests
        run: cargo test --locked --all-targets
      - name: Package check
        run: cargo publish --dry-run --locked
      - name: Release configuration
        run: python scripts/verify_release_config.py
      - name: Build x64 executable
        run: cargo build --locked --release
      - name: Stage portable build
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Verify portable build with synthetic data
        shell: pwsh
        run: ./scripts/verify_windows_package.ps1 -PackageDirectory dist/lazykatok-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: lazykatok-windows-x64-experimental
          path: dist/
          retention-days: 14
